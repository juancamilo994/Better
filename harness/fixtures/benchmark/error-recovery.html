<!doctype html><html lang="en"><meta charset="utf-8"><title>Error recovery candidate</title><style>body{font:18px system-ui;padding:24px}input,button{font:inherit;padding:12px}form{margin:24px 0}label{display:block}</style><h1>Reserve a workshop</h1><form id="bad" onsubmit="event.preventDefault();this.reset();this.querySelector('[role=status]').textContent='Error: choose another date'"><label>Name <input name="name"></label><button>Reserve</button><p role="status">Ready</p></form><form id="good" onsubmit="event.preventDefault();this.querySelector('[role=status]').textContent='Error: choose another date'"><label>Name <input name="name"></label><button>Reserve</button><p role="status">Ready</p><button type="button" onclick="this.previousElementSibling.textContent='Reservation confirmed'">Choose available date</button></form></html>
